spring:
  config:
    activate:
      on-profile: jpa
  autoconfigure:
    # Lista vacía: con el perfil `jpa` DataSource, Hibernate y los repositorios
    # Spring Data JPA vuelven a activarse.
    exclude: []
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
